# sc-gateway broker. Password auth, per-client ACLs, TLS for anything off loopback.
#
# 1883 stays on loopback. Credentialed LAN clients use 8883 and TLS.
# Do not add a second plaintext listener, and do not set acl_file or
# password_file. On Mosquitto 2.0 the built-in acl_file plugin accepts every
# SUBSCRIBE (it returns success for MOSQ_ACL_SUBSCRIBE), so a denied
# subscribe would never produce SUBACK 0x80. Authentication and ACLs come
# from the dynamic-security plugin. init-broker.sh writes that plugin line to
# /etc/mosquitto/sc/conf.d/plugin.conf and the database next to it.
#
# Install, on the device, after the passwords are in the environment:
#   sudo install -d -m 0750 /etc/mosquitto/sc
#   sudo deploy/mosquitto/init-broker.sh --dest /etc/mosquitto/sc
#   sudo install -m 0644 deploy/mosquitto/mosquitto.conf /etc/mosquitto/conf.d/sc.conf
# Restarting the live broker is a later one-unit change, not part of writing
# these files.

per_listener_settings false
allow_anonymous false
allow_zero_length_clientid false

include_dir /etc/mosquitto/sc/conf.d

listener 1883 127.0.0.1
protocol mqtt

listener 8883
protocol mqtt
cafile /etc/mosquitto/sc/certs/ca.crt
certfile /etc/mosquitto/sc/certs/server.crt
keyfile /etc/mosquitto/sc/certs/server.key
require_certificate false
tls_version tlsv1.2

persistence true
persistence_location /var/lib/mosquitto/
log_dest syslog
connection_messages true
