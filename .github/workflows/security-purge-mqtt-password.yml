name: Final MQTT sanitation verification

# Temporary one-shot workflow for the 2026-08-13 security cleanup.
# It fixes the one generated MQTT environment expression, syntax-checks every
# Python service touched by the credential purge, commits only project files,
# and is deleted after verification.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-purge-mqtt-password.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalise required MQTT environment read
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('interfaces/voice.py')
          text = path.read_text(encoding='utf-8')
          old = 'os.getenv("MQTT_PASS", os.environ["MQTT_PASS"])'
          new = 'os.environ["MQTT_PASS"]'
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
              print('Normalised interfaces/voice.py MQTT_PASS configuration.')
          else:
              print('interfaces/voice.py already uses the expected MQTT_PASS form.')
          PY

      - name: Syntax-check sanitized Python services
        shell: bash
        run: |
          python3 -m py_compile \
            interfaces/voice.py \
            services/avatar_bridge.py \
            services/contemplation.py \
            deploy/vision-nodes/pi1_vision_detector.py \
            deploy/vision-nodes/jetson_vision_detector.py

      - name: Verify MQTT password comes from runtime environment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('interfaces/voice.py'),
              Path('services/avatar_bridge.py'),
              Path('services/contemplation.py'),
              Path('deploy/vision-nodes/pi1_vision_detector.py'),
              Path('deploy/vision-nodes/jetson_vision_detector.py'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              if 'os.environ["MQTT_PASS"]' not in text:
                  raise SystemExit(f'{path} is not using required runtime MQTT_PASS configuration')
          print('All sanitized Python services require runtime MQTT_PASS configuration.')
          PY

      - name: Commit final project-file fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No project-file changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add interfaces/voice.py
          if git diff --cached --quiet; then
            echo 'No project-file changes to commit.'
            exit 0
          fi
          git commit -m 'security: normalize runtime MQTT credential configuration'
          git pull --rebase origin main
          git push origin HEAD:main
