name: One-shot MQTT credential purge

# Temporary hygiene workflow created during the 2026-08-13 repository audit.
# It runs only when this file itself changes, removes the compromised historical
# MQTT password from the current tree, commits the sanitation once, then becomes
# inert. Delete this workflow after the sanitation commit is verified.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security-purge-mqtt-password.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Purge compromised MQTT password from current tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          secret = 'sentient1312'
          replacement_doc = '<REDACTED_ROTATE_MQTT_PASSWORD>'
          changed = []
          skipped_binary = []

          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for name in filter(None, names):
              path = Path(name)
              try:
                  raw = path.read_bytes()
              except OSError:
                  continue
              if b'\x00' in raw:
                  skipped_binary.append(name)
                  continue
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  skipped_binary.append(name)
                  continue
              if secret not in text:
                  continue

              original = text

              if path.suffix == '.py':
                  # Turn a standalone Python string literal containing the old
                  # password into a required runtime environment read. This
                  # covers assignments, dataclass defaults, dict values and
                  # function arguments while preserving surrounding code.
                  exact_literal = ('"' + secret + '"', "'" + secret + "'")
                  if any(lit in text for lit in exact_literal):
                      if not re.search(r'(?m)^import os\s*$', text) and not re.search(r'(?m)^from os\b', text):
                          # Preserve the module docstring by inserting immediately
                          # before the first normal import/from statement.
                          m = re.search(r'(?m)^(?:import|from)\s+', text)
                          if not m:
                              raise RuntimeError(f'Cannot safely insert import os in {name}')
                          text = text[:m.start()] + 'import os\n' + text[m.start():]
                      text = text.replace('"' + secret + '"', 'os.environ["MQTT_PASS"]')
                      text = text.replace("'" + secret + "'", 'os.environ["MQTT_PASS"]')

                  # Any residual occurrence is documentation/comment/string text,
                  # not a standalone Python password literal. Redact it so the
                  # compromised value disappears from the current tree.
                  text = text.replace(secret, replacement_doc)
              else:
                  # Markdown, shell, config, text and other source formats are
                  # redacted rather than guessed at. Existing deployment docs are
                  # superseded by SECURITY.md and must be reconfigured with a new
                  # runtime secret before use.
                  text = text.replace(secret, replacement_doc)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(name)

          # Hard fail if the credential remains anywhere Git reports as text.
          remaining = []
          for name in filter(None, names):
              path = Path(name)
              try:
                  raw = path.read_bytes()
                  if b'\x00' not in raw and secret.encode() in raw:
                      remaining.append(name)
              except OSError:
                  pass
          if remaining:
              raise SystemExit('Credential still present in: ' + ', '.join(remaining))

          print(f'Sanitized {len(changed)} tracked text files:')
          for name in changed:
              print(' -', name)
          if skipped_binary:
              print(f'Skipped {len(skipped_binary)} binary/non-UTF8 files.')
          PY

      - name: Commit sanitation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No sanitation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'security: purge compromised MQTT password from current tree'
          git push origin HEAD:main
