name: Sentient Core source and AIRI card checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sentient-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile Python source without importing device services
        run: python -m compileall -q sentient services tools tests
      - name: Install isolated test runner
        run: python -m pip install pytest
      - name: Validate AIRI package contract and round-trip export
        run: python -m pytest -q tests/unit/test_airi_card.py
      - name: Validate Jetson model launcher syntax
        run: bash -n scripts/jetson-models.sh
      - name: Test llama.cpp adapter (local fake inference server)
        run: |
          python -m pip install aiohttp
          python -m unittest discover -s tests/unit -p test_local_openai.py -v
      - name: Validate rigged ATHENA installer and viewer
        run: |
          bash -n scripts/install-athena-avatar.sh
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html = Path('interfaces/web_chat/static/athena.html').read_text()
          scripts = re.findall(r'<script type="module">([\s\S]*?)</script>', html)
          assert len(scripts) == 1
          src = Path('/tmp/athena-viewer.mjs')
          src.write_text(scripts[0])
          subprocess.run(['node', '--check', str(src)], check=True)
          assert './models/athena.glb' in html
          PY
      - name: Editable install on Python 3.10
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          python - <<'PY'
          import importlib
          import importlib.util
          import sentient
          import sentient.config
          import sentient.common.mqtt_topics
          modules = [
              "fastapi",
              "uvicorn",
              "websockets",
              "pydantic",
              "starlette",
              "aiomqtt",
              "paho.mqtt.client",
              "redis",
              "numpy",
              "aiohttp",
              "tomli",
              "colorama",
              "onnxruntime",
          ]
          for name in modules:
              importlib.import_module(name)
              print("import ok", name)
          for banned in ("torch", "sentence_transformers"):
              if importlib.util.find_spec(banned) is not None:
                  raise SystemExit(f"{banned} must not be installed")
          import paho.mqtt.client as mqtt
          mqtt.Client(callback_api_version=mqtt.CallbackAPIVersion.VERSION1, client_id="ci")
          mqtt.Client(mqtt.CallbackAPIVersion.VERSION2)
          print("editable install ok", sentient.__file__)
          PY
      - name: Fetch MiniLM and check ONNX embeddings
        run: |
          set -euo pipefail
          python tools/fetch_minilm.py
          python -m pytest -q tests/unit/test_minilm.py
      - name: Verify pinned CPython 3.10 aarch64 lock hashes
        run: |
          set -euo pipefail
          bash -n deploy/build-wheels.sh
          rm -rf /tmp/wheelhouse
          mkdir -p /tmp/wheelhouse
          python -m pip download \
            --dest /tmp/wheelhouse \
            --require-hashes \
            --only-binary=:all: \
            --python-version 310 \
            --implementation cp \
            --abi cp310 \
            --abi abi3 \
            --abi none \
            --platform manylinux_2_35_aarch64 \
            --platform manylinux_2_34_aarch64 \
            --platform manylinux_2_28_aarch64 \
            --platform manylinux_2_17_aarch64 \
            --platform manylinux2014_aarch64 \
            --platform any \
            -r constraints.lock
          python - <<'PY'
          from pathlib import Path
          files = sorted(p.name for p in Path("/tmp/wheelhouse").iterdir())
          print(f"downloaded {len(files)} aarch64/pure artifacts")
          needed = ("onnxruntime", "numpy", "fastapi", "aiohttp", "tflite_runtime", "opencv_python_headless", "webrtcvad")
          blob = " ".join(files)
          missing = [name for name in needed if name not in blob]
          if missing:
              raise SystemExit(f"lock download missing {missing}")
          if any(name.startswith(("torch-", "sentence_transformers-")) for name in files):
              raise SystemExit("torch or sentence-transformers leaked into the lock")
          print("lock hashes ok")
          PY
