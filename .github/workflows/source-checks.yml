name: Sentient Core source and AIRI card checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sentient-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile Python source without importing device services
        run: python -m compileall -q sentient services tools tests
      - name: Install isolated test runner
        run: python -m pip install pytest
      - name: Validate AIRI package contract and round-trip export
        run: python -m pytest -q tests/unit/test_airi_card.py
      - name: Validate Jetson model launcher syntax
        run: bash -n scripts/jetson-models.sh
      - name: Test llama.cpp adapter (local fake inference server)
        run: |
          python -m pip install aiohttp
          python -m unittest discover -s tests/unit -p test_local_openai.py -v
