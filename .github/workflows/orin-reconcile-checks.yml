name: Orin AIRI migration safety
on:
  push:
    branches: [main]
    paths:
      - 'tools/orin_reconcile.py'
      - 'tools/orin_read_only_audit.sh'
      - 'tests/unit/test_orin_reconcile.py'
      - 'systemd/deploy.sh'
      - 'systemd/install.sh'
      - '.github/workflows/orin-reconcile-checks.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile Python and check Bash syntax
        run: |
          python3 -m py_compile tools/orin_reconcile.py tests/unit/test_orin_reconcile.py
          bash -n tools/orin_read_only_audit.sh systemd/deploy.sh systemd/install.sh
      - name: Test one-at-a-time cutover, rollback, and safety gates
        run: python3 -m unittest discover -s tests/unit -p test_orin_reconcile.py -v
      - name: Ensure retired bulk installers mutate nothing
        shell: bash
        run: |
          set -euo pipefail
          for script in systemd/deploy.sh systemd/install.sh; do
            set +e
            output="$(bash "$script" 2>&1)"
            rc=$?
            set -e
            test "$rc" -eq 64
            grep -q '^BLOCKED:' <<<"$output"
          done
