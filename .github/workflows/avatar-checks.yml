name: Avatar stream and hologram renderer
on:
  push:
    branches: [main, ws/avatar]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: avatar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python unit tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/unit/test_avatar_stream.py tests/unit/test_avatar_validator.py tests/unit/test_avatar_measure.py
      - name: Compile avatar Python and shell
        run: |
          python -m compileall -q sentient/services/avatar_stream avatar
          bash -n avatar/display/install-node.sh avatar/display/kiosk.sh avatar/tools/optimise_glb.sh avatar/renderer/build.sh
      - name: Renderer checksums and protocol tests
        run: |
          cd avatar/renderer
          sha256sum -c checksums.sha256
          node --test tests/protocol.test.mjs tests/mqtt.test.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright Chromium
        working-directory: avatar/renderer
        run: |
          npm install --no-save --no-fund --no-audit @playwright/test@1.49.1
          npx playwright install --with-deps chromium
          npx playwright test
