name: Native Orin voice recovery
on:
  push:
    paths:
      - 'deploy/orin-native-voice/**'
      - '.github/workflows/orin-native-voice.yml'
  pull_request:
    paths:
      - 'deploy/orin-native-voice/**'
      - '.github/workflows/orin-native-voice.yml'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Python syntax
        run: python -m compileall -q deploy/orin-native-voice
      - name: Exercise microphone recovery and guarded deployment
        run: python -m unittest discover -s deploy/orin-native-voice/tests -p 'test_*.py' -v
      - name: Exercise kiosk voice status
        run: node --test deploy/orin-native-voice/tests/status.test.cjs
      - name: Check Athena PowerShell deployment syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'deploy/orin-native-voice/Deploy-OrinVoiceRecovery.ps1').Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
