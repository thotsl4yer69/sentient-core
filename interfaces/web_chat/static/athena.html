<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATHENA — 3D Companion</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;--bg:#080f19;--line:#2d4859;--cyan:#6be9fb;--white:#e6f1f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);overflow:hidden}
#stage{display:block;width:100vw;height:100dvh;touch-action:none}
#hud{position:absolute;left:20px;top:20px;max-width:370px;pointer-events:none}
h1{font-size:24px;font-weight:550;letter-spacing:.2em;margin:0 0 4px}
.subtitle{font-size:11px;letter-spacing:.22em;color:var(--cyan);text-transform:uppercase;margin:0 0 18px}
.status{border:1px solid var(--line);padding:9px 12px;background:#0e1b2dc9;font-size:12px;line-height:1.5}
#actions{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:90vw}
button{border:1px solid #356477;background:#102135ef;color:#cbf5fb;border-radius:9px;padding:11px 15px;cursor:pointer;font-size:13px}
button:hover,button:focus-visible{outline:1px solid var(--cyan)}
#spec{position:absolute;top:20px;right:20px;text-align:right;color:#8cabb9;font-size:11px;letter-spacing:.12em}
#errors{color:#ffb6af;margin-top:8px;font-size:12px;white-space:pre-wrap}
@media(max-width:600px){#hud{left:12px;top:12px;max-width:65%}#spec{top:14px;right:12px;font-size:9px}h1{font-size:17px}button{padding:10px;font-size:12px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="stage" aria-label="Interactive 3D ATHENA female avatar"></canvas>
<div id="hud"><h1>ATHENA</h1><p class="subtitle">Local companion / actual skinned GLB</p><div class="status" id="status">Loading rig...</div><div id="errors"></div></div>
<div id="spec">LOCAL ASSET<br>163 JOINTS · GLTF 2.0<br><span id="fps">— FPS</span></div>
<div id="actions"><button id="idle">Idle animation</button><button id="speak">Test speaking</button><button id="rotate">Auto rotate</button><button id="reset">Reset camera</button></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const canvas=document.querySelector('#stage'), status=document.querySelector('#status'), error=document.querySelector('#errors');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.65;
renderer.setClearColor(0x09121e);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x09121e);
scene.fog=new THREE.FogExp2(0x09121e,0.012);
const camera=new THREE.PerspectiveCamera(42,1,.01,100);camera.position.set(.8,1.15,2.6);
const controls=new OrbitControls(camera,canvas);
controls.target.set(0,.85,0);controls.enableDamping=true;controls.minDistance=.5;controls.maxDistance=8;
scene.add(new THREE.HemisphereLight(0xbbefff,0x2a304b,2.7));
const key=new THREE.DirectionalLight(0xeaf7ff,3.0);key.position.set(-2,3,4);scene.add(key);
const fill=new THREE.DirectionalLight(0x7ecbfd,1.3);fill.position.set(2,2,1.5);scene.add(fill);
const rim=new THREE.DirectionalLight(0x22b3fc,3);rim.position.set(2,2,-3);scene.add(rim);
const grid=new THREE.GridHelper(4,20,0x173a54,0x11283d);grid.position.y=-.009;scene.add(grid);
let character=null,mixer=null,clipAction=null,jaw=null,jawRest=null,speaking=false,autoRotate=false,paused=false,loaded=false;
const clock=new THREE.Clock();
let startMs=performance.now(),frames=0,prevFps=startMs;
function setStatus(t){status.textContent=t;}
function errorStatus(t){error.textContent=t;}
function resetCamera(){camera.position.set(.8,1.15,2.6);controls.target.set(0,.85,0);controls.update();}
const loader=new GLTFLoader();
loader.load('./models/athena.glb',(gltf)=>{
 character=gltf.scene;
 scene.add(character);
 const bounds=new THREE.Box3().setFromObject(character);
 const size=new THREE.Vector3();bounds.getSize(size);
 // Keep source 1.6m skeleton scale: floor centered at world y=0.
 const center=new THREE.Vector3();bounds.getCenter(center);
 character.position.x-=center.x;
 character.position.z-=center.z;
 character.position.y-=bounds.min.y;
 bounds.setFromObject(character);
 controls.target.set(0,bounds.max.y*.53,0);
 camera.position.set(.72,bounds.max.y*.59,2.5);
 const actualBones=[];character.traverse(o=>{
  if(o.isBone)actualBones.push(o);
  if(o.name==='jaw'){jaw=o;jawRest=o.quaternion.clone();}
 });
 mixer=new THREE.AnimationMixer(character);
 if(gltf.animations.length){clipAction=mixer.clipAction(gltf.animations[0]);clipAction.play();}
 loaded=true;
 setStatus('Ready — '+actualBones.length+' rig bones · '+gltf.animations.length+' animation clip · orbit by dragging');
},undefined,(err)=>{setStatus('Avatar file unavailable');errorStatus('Run scripts/install-athena-avatar.sh on the Orin. '+String(err));});
document.querySelector('#idle').addEventListener('click',()=>{paused=!paused;document.querySelector('#idle').textContent=paused?'Resume idle':'Pause idle';});
document.querySelector('#speak').addEventListener('click',()=>{speaking=!speaking;document.querySelector('#speak').textContent=speaking?'Stop speaking':'Test speaking';});
document.querySelector('#rotate').addEventListener('click',()=>{autoRotate=!autoRotate;document.querySelector('#rotate').textContent=autoRotate?'Stop rotation':'Auto rotate';});
document.querySelector('#reset').addEventListener('click',resetCamera);
const proto=location.protocol==='https:'?'wss:':'ws:';
let ws;
function connect(){
 if(!loaded)return;
 try{
  ws=new WebSocket(proto+'//'+location.host+'/ws');
  ws.onmessage=event=>{
   let d;try{d=JSON.parse(event.data)}catch{return}
   if(d.type==='speaking')speaking=Boolean(d.active);
   if(d.type==='tts_started')speaking=true;
   if(d.type==='tts_completed')speaking=false;
  };
  ws.onerror=()=>{};
  ws.onclose=()=>{ws=null;};
 }catch{}
}
setInterval(()=>{if(loaded&&!ws)connect()},5000);
function resize(){
 const width=canvas.clientWidth,height=canvas.clientHeight;
 if(canvas.width!==Math.round(width*renderer.getPixelRatio())||canvas.height!==Math.round(height*renderer.getPixelRatio())){
  renderer.setSize(width,height,false);camera.aspect=width/height;camera.updateProjectionMatrix();
 }
}
function loop(){
 requestAnimationFrame(loop);
 const dt=Math.min(clock.getDelta(),.08);
 if(mixer&&!paused)mixer.update(dt);
 if(jaw&&jawRest){
  const angle=speaking?(0.12+.08*Math.sin(performance.now()*.026)):0;
  jaw.quaternion.copy(jawRest).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),angle));
 }
 controls.autoRotate=autoRotate;controls.autoRotateSpeed=.8;controls.update();
 resize();renderer.render(scene,camera);
 frames++;const now=performance.now();if(now-prevFps>1000){document.querySelector('#fps').textContent=Math.round(frames*1000/(now-prevFps))+' FPS';frames=0;prevFps=now;}
}
loop();
</script></body></html>
