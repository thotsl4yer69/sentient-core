[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentient-core"
version = "2.0.0"
description = "Sentient Core - AI Operating System"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn[standard]==0.54.0",
    "websockets==16.1.1",
    "pydantic==2.14.3",
    "starlette==1.7.0",
    "aiomqtt==2.5.1",
    "paho-mqtt==2.2.0",
    "redis[hiredis]==8.1.0",
    "numpy==2.2.6",
    "aiohttp==3.14.5",
    "tomli==2.5.0; python_version<'3.11'",
    "colorama==0.4.6",
    "onnxruntime==1.23.2",
    "tokenizers==0.23.3",
]

[project.optional-dependencies]
# PyAudio has no cp310 aarch64 wheel on PyPI. deploy/build-wheels.sh builds it.
voice = ["PyAudio==0.2.14", "webrtcvad-wheels==2.0.14.post1", "openwakeword==0.6.0"]
vision = ["opencv-python-headless==5.0.0.93"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sentient*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120
